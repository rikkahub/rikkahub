name: Agent Validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to validate
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: agent-validation-${{ github.event_name }}-${{ github.event.pull_request.head.sha || inputs.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, test, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout validation ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-home-cache-cleanup: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare secret-free Firebase configuration
        run: |
          # The Google Services plugin needs both the release and debug application IDs.
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-ci-debug",
              "storage_bucket": "rikkahub-ci-debug.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCiDebugBuildOnly0000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111111111",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCiDebugBuildOnly0000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          chmod +x gradlew

      - name: Compile Kotlin
        env:
          ORG_GRADLE_OPTS: -Xmx6g -Dfile.encoding=UTF-8
        run: ./gradlew compileDebugKotlin --no-configuration-cache --stacktrace

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-validation-room-schemas-${{ github.event_name }}-${{ github.run_number }}
          path: app/schemas/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run third-batch AI JVM tests
        env:
          ORG_GRADLE_OPTS: -Xmx6g -Dfile.encoding=UTF-8
        run: |
          test_filters=()
          add_test_filter() {
            local test_class="$1"
            local test_name="${test_class##*.}"
            local test_path="ai/src/test/java/${test_class//./\/}"
            local extension

            for extension in kt java; do
              if [[ -f "$test_path.$extension" ]] && \
                grep -Eq "(^|[[:space:]])class[[:space:]]+$test_name\\b" "$test_path.$extension"; then
                test_filters+=(--tests "$test_class")
                return
              fi
            done

            echo "Skipping absent targeted test: $test_class"
          }

          for test_class in \
            me.rerere.ai.util.BoundedStreamBridgeTest \
            me.rerere.ai.provider.ModelCapabilityProfileTest; do
            add_test_filter "$test_class"
          done
          if ((${#test_filters[@]})); then
            ./gradlew :ai:testDebugUnitTest "${test_filters[@]}" --no-configuration-cache --stacktrace
          else
            echo "No targeted AI tests exist on the checked out ref."
          fi

      - name: Run third-batch app JVM tests
        env:
          ORG_GRADLE_OPTS: -Xmx6g -Dfile.encoding=UTF-8
        run: |
          test_filters=()
          add_test_filter() {
            local test_class="$1"
            local test_name="${test_class##*.}"
            local test_path="app/src/test/java/${test_class//./\/}"
            local extension

            for extension in kt java; do
              if [[ -f "$test_path.$extension" ]] && \
                grep -Eq "(^|[[:space:]])class[[:space:]]+$test_name\\b" "$test_path.$extension"; then
                test_filters+=(--tests "$test_class")
                return
              fi
            done

            echo "Skipping absent targeted test: $test_class"
          }

          for test_class in \
            me.rerere.rikkahub.data.ai.agent.context.ContextGovernorTest \
            me.rerere.rikkahub.data.artifacts.ToolArtifactStoreTest \
            me.rerere.rikkahub.data.ai.agent.preflight.ProviderPreflightTest \
            me.rerere.rikkahub.data.ai.agent.SubagentTest \
            me.rerere.rikkahub.data.ai.agent.trace.AgentTraceReplayTest; do
            add_test_filter "$test_class"
          done
          if ((${#test_filters[@]})); then
            ./gradlew :app:testDebugUnitTest "${test_filters[@]}" --no-configuration-cache --stacktrace
          else
            echo "No targeted app tests exist on the checked out ref."
          fi

      - name: Run app and search JVM test suites
        env:
          ORG_GRADLE_OPTS: -Xmx6g -Dfile.encoding=UTF-8
        run: ./gradlew :app:testDebugUnitTest :search:testDebugUnitTest --no-configuration-cache --stacktrace

      - name: Run platform-independent workspace JVM tests
        env:
          ORG_GRADLE_OPTS: -Xmx6g -Dfile.encoding=UTF-8
        run: |
          test_filters=()
          add_test_filter() {
            local test_class="$1"
            local test_name="${test_class##*.}"
            local test_path="workspace/src/test/java/${test_class//./\/}"
            local extension

            for extension in kt java; do
              if [[ -f "$test_path.$extension" ]] && \
                grep -Eq "(^|[[:space:]])class[[:space:]]+$test_name\\b" "$test_path.$extension"; then
                test_filters+=(--tests "$test_class")
                return
              fi
            done

            echo "Skipping absent targeted test: $test_class"
          }

          for test_class in \
            me.rerere.workspace.RootfsPathTest \
            me.rerere.workspace.RootfsInstallerTest; do
            add_test_filter "$test_class"
          done
          if ((${#test_filters[@]})); then
            ./gradlew :workspace:testDebugUnitTest "${test_filters[@]}" --no-configuration-cache --stacktrace
          else
            echo "No targeted workspace tests exist on the checked out ref."
          fi

      - name: Assemble debug APK
        env:
          ORG_GRADLE_OPTS: -Xmx6g -Dfile.encoding=UTF-8
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-validation-test-reports-${{ github.event_name }}-${{ github.run_number }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-validation-debug-apk-${{ github.event_name }}-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint report (non-blocking baseline)
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout validation ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-home-cache-cleanup: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare secret-free Firebase configuration
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-ci-debug",
              "storage_bucket": "rikkahub-ci-debug.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCiDebugBuildOnly0000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111111111",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCiDebugBuildOnly0000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          chmod +x gradlew

      - name: Run Android lint and distinguish findings from execution failures
        env:
          ORG_GRADLE_OPTS: -Xmx6g -Dfile.encoding=UTF-8
        run: |
          set +e
          ./gradlew lint --no-configuration-cache --stacktrace 2>&1 | tee lint-output.log
          lint_exit=${PIPESTATUS[0]}
          set -e

          lint_report=$(find . -type f \( -path '*/build/reports/lint/*' -o -path '*/build/reports/lint-results-*.*' \) -print -quit)
          if [[ -z "$lint_report" ]]; then
            echo "Lint exited with $lint_exit without producing a report." >&2
            exit 1
          fi

          if ((lint_exit)); then
            if ! grep -Eq "Execution failed for task '.*:lint[^']*'" lint-output.log; then
              echo "Gradle failed outside a lint task (exit $lint_exit)." >&2
              exit "$lint_exit"
            fi
            echo "Lint findings reported in $lint_report; preserving the non-blocking baseline."
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-validation-lint-reports-${{ github.event_name }}-${{ github.run_number }}
          path: |
            **/build/reports/lint/**
            **/build/reports/lint-results-*.*
          if-no-files-found: warn
          retention-days: 14
